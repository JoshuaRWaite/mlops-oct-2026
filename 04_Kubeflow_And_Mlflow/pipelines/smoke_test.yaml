# PIPELINE DEFINITION
# Name: smoke-test
# Description: Can a pipeline pod reach MLflow and see the GPU?
# Inputs:
#    mlflow_uri: str [Default: 'http://172.18.0.1:5000']
components:
  comp-check-gpu:
    executorLabel: exec-check-gpu
  comp-check-mlflow:
    executorLabel: exec-check-mlflow
    inputDefinitions:
      parameters:
        mlflow_uri:
          parameterType: STRING
deploymentSpec:
  executors:
    exec-check-gpu:
      container:
        command:
        - python
        - -c
        - "\nimport torch\nprint(\"torch\", torch.__version__, \"| cuda available:\"\
          , torch.cuda.is_available())\nif not torch.cuda.is_available():\n    raise\
          \ SystemExit(\"FAIL: no GPU is visible inside this pod\")\nprint(\"GPU:\"\
          , torch.cuda.get_device_name(0))\nx = torch.randn(2048, 2048, device=\"\
          cuda\")\nprint(\"matrix multiply on the GPU worked:\", bool((x @ x).sum().isfinite()))\n"
        image: house-autoencoder:module4
        resources:
          accelerator:
            count: '1'
            resourceCount: '1'
            resourceType: nvidia.com/gpu
            type: nvidia.com/gpu
    exec-check-mlflow:
      container:
        args:
        - '{{$.inputs.parameters[''mlflow_uri'']}}'
        command:
        - python
        - -c
        - '

          import sys, urllib.request

          url = sys.argv[1].rstrip("/") + "/health"

          print("GET", url)

          print("MLflow answered:", urllib.request.urlopen(url, timeout=10).read().decode())

          '
        image: house-autoencoder:module4
pipelineInfo:
  description: Can a pipeline pod reach MLflow and see the GPU?
  name: smoke-test
root:
  dag:
    tasks:
      check-gpu:
        cachingOptions: {}
        componentRef:
          name: comp-check-gpu
        taskInfo:
          name: check-gpu
      check-mlflow:
        cachingOptions: {}
        componentRef:
          name: comp-check-mlflow
        inputs:
          parameters:
            mlflow_uri:
              componentInputParameter: mlflow_uri
        taskInfo:
          name: check-mlflow
  inputDefinitions:
    parameters:
      mlflow_uri:
        defaultValue: http://172.18.0.1:5000
        isOptional: true
        parameterType: STRING
schemaVersion: 2.1.0
sdkVersion: kfp-2.18.0

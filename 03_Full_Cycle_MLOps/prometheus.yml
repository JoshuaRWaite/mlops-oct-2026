# Prometheus config: every 5 seconds, fetch /metrics from each target below.
global:
  scrape_interval: 5s      # fast so the demo dashboard feels live; 15s-60s is typical in production

scrape_configs:
  - job_name: fastapi      # our model API (fastapi_app.py)
    static_configs:
      - targets: ["127.0.0.1:8000"]

  - job_name: prometheus   # Prometheus monitoring itself
    static_configs:
      - targets: ["127.0.0.1:9090"]
